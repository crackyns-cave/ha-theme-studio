  # ============================================================================
  # FROSTED GLASS VISUAL SYSTEM
  # ============================================================================
  # Apple Big Sur-style frosted glass with backdrop blur and saturation.
  # Uses translucent surfaces with blur effects and subtle shadows.
  # Soft borders provide definition without harsh lines.
  # ============================================================================

  # ----------------------------------------------------------------------------
  # FROSTED GLASS BACKDROP FILTERS
  # ----------------------------------------------------------------------------
  # Blur and saturation effects for frosted glass appearance
  
  fg-backdrop-blur-light: &fg-backdrop-blur-light "blur(20px) saturate(180%)"
  fg-backdrop-blur-medium: &fg-backdrop-blur-medium "blur(30px) saturate(180%)"
  fg-backdrop-blur-heavy: &fg-backdrop-blur-heavy "blur(40px) saturate(200%)"
  
  fg-backdrop-blur-card: *fg-backdrop-blur-light
  fg-backdrop-blur-dialog: *fg-backdrop-blur-medium
  fg-backdrop-blur-sidebar: *fg-backdrop-blur-light
  fg-backdrop-blur-header: *fg-backdrop-blur-light
  
  # ----------------------------------------------------------------------------
  # FROSTED GLASS SHADOWS - LIGHT MODE
  # ----------------------------------------------------------------------------
  # Subtle, soft shadows that complement translucent surfaces
  
  fg-light-shadow-subtle: &fg-light-shadow-subtle |
    0px 1px 3px rgba(0, 0, 0, 0.08),
    0px 1px 2px rgba(0, 0, 0, 0.06)
  
  fg-light-shadow-sm: &fg-light-shadow-sm |
    0px 2px 8px rgba(0, 0, 0, 0.08),
    0px 1px 4px rgba(0, 0, 0, 0.06)
  
  fg-light-shadow-md: &fg-light-shadow-md |
    0px 4px 16px rgba(0, 0, 0, 0.1),
    0px 2px 8px rgba(0, 0, 0, 0.06)
  
  fg-light-shadow-lg: &fg-light-shadow-lg |
    0px 8px 24px rgba(0, 0, 0, 0.12),
    0px 4px 12px rgba(0, 0, 0, 0.08)
  
  fg-light-shadow-xl: &fg-light-shadow-xl |
    0px 16px 48px rgba(0, 0, 0, 0.14),
    0px 8px 24px rgba(0, 0, 0, 0.1)
  
  # Hover state (slightly elevated)
  fg-light-shadow-sm-hover: &fg-light-shadow-sm-hover |
    0px 4px 12px rgba(0, 0, 0, 0.1),
    0px 2px 6px rgba(0, 0, 0, 0.08)
  
  fg-light-shadow-md-hover: &fg-light-shadow-md-hover |
    0px 6px 20px rgba(0, 0, 0, 0.12),
    0px 3px 10px rgba(0, 0, 0, 0.08)
  
  # ----------------------------------------------------------------------------
  # FROSTED GLASS SHADOWS - DARK MODE
  # ----------------------------------------------------------------------------
  # Slightly stronger shadows for dark backgrounds with translucency
  
  fg-dark-shadow-subtle: &fg-dark-shadow-subtle |
    0px 1px 3px rgba(0, 0, 0, 0.3),
    0px 1px 2px rgba(0, 0, 0, 0.2)
  
  fg-dark-shadow-sm: &fg-dark-shadow-sm |
    0px 2px 8px rgba(0, 0, 0, 0.4),
    0px 1px 4px rgba(0, 0, 0, 0.3)
  
  fg-dark-shadow-md: &fg-dark-shadow-md |
    0px 4px 16px rgba(0, 0, 0, 0.5),
    0px 2px 8px rgba(0, 0, 0, 0.3)
  
  fg-dark-shadow-lg: &fg-dark-shadow-lg |
    0px 8px 24px rgba(0, 0, 0, 0.6),
    0px 4px 12px rgba(0, 0, 0, 0.4)
  
  fg-dark-shadow-xl: &fg-dark-shadow-xl |
    0px 16px 48px rgba(0, 0, 0, 0.7),
    0px 8px 24px rgba(0, 0, 0, 0.5)
  
  # Hover state (slightly elevated)
  fg-dark-shadow-sm-hover: &fg-dark-shadow-sm-hover |
    0px 4px 12px rgba(0, 0, 0, 0.5),
    0px 2px 6px rgba(0, 0, 0, 0.4)
  
  fg-dark-shadow-md-hover: &fg-dark-shadow-md-hover |
    0px 6px 20px rgba(0, 0, 0, 0.6),
    0px 3px 10px rgba(0, 0, 0, 0.4)
  
  # ----------------------------------------------------------------------------
  # FROSTED GLASS BORDER SYSTEM
  # ----------------------------------------------------------------------------
  # Soft, semi-transparent borders
  
  fg-border-width: "0.5px"
  fg-border-width-thick: "1px"
  fg-border-style: "solid"
  
  # ----------------------------------------------------------------------------
  # CROSS-COMPATIBILITY ALIASES
  # ----------------------------------------------------------------------------
  # Aliases for glass-* variables used by some color palettes
  # Maps Liquid Glass naming to Frosted Glass equivalents
  
  # Glass background aliases (translucent surfaces)
  glass-bg-light-resting: &glass-bg-light-resting "rgba(255, 255, 255, 0.72)"
  glass-bg-light-hover: &glass-bg-light-hover "rgba(255, 255, 255, 0.85)"
  glass-bg-light-active: &glass-bg-light-active "rgba(255, 255, 255, 0.60)"
  glass-bg-light-subtle: &glass-bg-light-subtle "rgba(255, 255, 255, 0.50)"
  glass-bg-light-intense: &glass-bg-light-intense "rgba(255, 255, 255, 0.92)"
  
  glass-bg-dark-resting: &glass-bg-dark-resting "rgba(30, 30, 34, 0.75)"
  glass-bg-dark-hover: &glass-bg-dark-hover "rgba(45, 45, 50, 0.88)"
  glass-bg-dark-active: &glass-bg-dark-active "rgba(30, 30, 34, 0.62)"
  glass-bg-dark-subtle: &glass-bg-dark-subtle "rgba(22, 22, 26, 0.55)"
  glass-bg-dark-intense: &glass-bg-dark-intense "rgba(55, 55, 60, 0.95)"
  
  # Glass blur aliases
  glass-blur-subtle: *fg-backdrop-blur-light
  glass-blur-light: *fg-backdrop-blur-light
  glass-blur-medium: *fg-backdrop-blur-medium
  glass-blur-heavy: *fg-backdrop-blur-heavy
  glass-blur-intense: *fg-backdrop-blur-heavy
  glass-blur-card: *fg-backdrop-blur-light
  glass-blur-dialog: *fg-backdrop-blur-medium
  glass-blur-sidebar: *fg-backdrop-blur-light
  glass-blur-header: *fg-backdrop-blur-light
  
  # Glass border aliases
  glass-border-light-quiet: &glass-border-light-quiet "rgba(255, 255, 255, 0.25)"
  glass-border-light-normal: &glass-border-light-normal "rgba(255, 255, 255, 0.35)"
  glass-border-light-loud: &glass-border-light-loud "rgba(255, 255, 255, 0.50)"
  glass-border-light-luminous: &glass-border-light-luminous "rgba(255, 255, 255, 0.70)"
  glass-border-light-accent: &glass-border-light-accent "rgba(120, 120, 255, 0.35)"
  
  glass-border-dark-quiet: &glass-border-dark-quiet "rgba(255, 255, 255, 0.08)"
  glass-border-dark-normal: &glass-border-dark-normal "rgba(255, 255, 255, 0.15)"
  glass-border-dark-loud: &glass-border-dark-loud "rgba(255, 255, 255, 0.25)"
  glass-border-dark-luminous: &glass-border-dark-luminous "rgba(255, 255, 255, 0.40)"
  glass-border-dark-accent: &glass-border-dark-accent "rgba(140, 140, 255, 0.45)"
  
  glass-border-width-thin: *fg-border-width
  glass-border-width-normal: *fg-border-width-thick
  glass-border-width-thick: *fg-border-width-thick
  
  # Glass shadow aliases
  glass-shadow-light-subtle: *fg-light-shadow-subtle
  glass-shadow-light-sm: *fg-light-shadow-sm
  glass-shadow-light-md: *fg-light-shadow-md
  glass-shadow-light-lg: *fg-light-shadow-lg
  glass-shadow-light-xl: *fg-light-shadow-xl
  
  glass-shadow-dark-subtle: *fg-dark-shadow-subtle
  glass-shadow-dark-sm: *fg-dark-shadow-sm
  glass-shadow-dark-md: *fg-dark-shadow-md
  glass-shadow-dark-lg: *fg-dark-shadow-lg
  glass-shadow-dark-xl: *fg-dark-shadow-xl
  
  # Glass highlight aliases (frosted glass doesn't use highlights, provide subtle values)
  glass-highlight-light-edge: &glass-highlight-light-edge "rgba(255, 255, 255, 0.50)"
  glass-highlight-light-glow: &glass-highlight-light-glow "rgba(255, 255, 255, 0.30)"
  glass-highlight-light-shine: &glass-highlight-light-shine "linear-gradient(135deg, rgba(255, 255, 255, 0.20) 0%, rgba(255, 255, 255, 0) 50%)"
  
  glass-highlight-dark-edge: &glass-highlight-dark-edge "rgba(255, 255, 255, 0.20)"
  glass-highlight-dark-glow: &glass-highlight-dark-glow "rgba(255, 255, 255, 0.10)"
  glass-highlight-dark-shine: &glass-highlight-dark-shine "linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 50%)"
  
  # Glass radius aliases
  glass-radius-sm: &glass-radius-sm "10px"
  glass-radius: &glass-radius "14px"
  glass-radius-lg: &glass-radius-lg "18px"
  glass-radius-xl: &glass-radius-xl "26px"
  glass-radius-pill: &glass-radius-pill "999px"
