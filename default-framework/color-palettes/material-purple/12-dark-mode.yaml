    # ==========================================================================
    # DARK MODE - Material 3 Surface Hierarchy
    # ==========================================================================
    # Clean Material Design 3 dark theme with surface containers and elevation.
    # Background: #1C1B1F | Surface: Material surface containers
    # Uses tonal palettes and realistic shadows
    # ==========================================================================
    
    dark:
      
      # ------------------------------------------------------------------------
      # BASE COLORS - Foundation
      # ------------------------------------------------------------------------
      
      # Primary brand color
      primary-color: "#D0BCFF"
      accent-color: "#D0BCFF"
      
      # Semantic state colors
      state-icon-color: "#7FB2DC"
      state-icon-active-color: "#D0BCFF"
      state-icon-unavailable-color: "#606060"
      
      # Text colors
      primary-text-color: "#E6E1E5"
      secondary-text-color: "#CAC4D0"
      text-primary-color: "#1C1B1F"
      disabled-text-color: "#938F99"
      
      # Background and surface
      primary-background-color: "#1C1B1F"
      secondary-background-color: "#2B2930"
      lovelace-background: "#1C1B1F"
      
      # Cards - using surface-container
      card-background-color: "#2B2930"
      ha-card-background: "#2B2930"
      
      # Sidebar - using surface-container-low
      sidebar-background-color: "#211F26"
      sidebar-icon-color: "#CAC4D0"
      sidebar-selected-icon-color: "#D0BCFF"
      sidebar-selected-text-color: "#E6E1E5"
      sidebar-text-color: "#CAC4D0"
      
      # ------------------------------------------------------------------------
      # MATERIAL 3 ELEVATION SHADOWS - Dark Mode
      # ------------------------------------------------------------------------
      
      m3-elevation-0: "none"
      m3-elevation-1: "0px 1px 3px rgba(0, 0, 0, 0.5), 0px 1px 2px rgba(0, 0, 0, 0.3)"
      m3-elevation-2: "0px 2px 6px rgba(0, 0, 0, 0.5), 0px 1px 4px rgba(0, 0, 0, 0.3)"
      m3-elevation-3: "0px 4px 10px rgba(0, 0, 0, 0.5), 0px 2px 4px rgba(0, 0, 0, 0.3)"
      m3-elevation-4: "0px 6px 12px rgba(0, 0, 0, 0.5), 0px 2px 20px rgba(0, 0, 0, 0.3)"
      m3-elevation-5: "0px 8px 14px rgba(0, 0, 0, 0.5), 0px 4px 18px rgba(0, 0, 0, 0.3)"
      
      # Neumorphic compatibility aliases (map to Material elevation)
      neu-shadow-raised-sm: "0px 1px 3px rgba(0, 0, 0, 0.5), 0px 1px 2px rgba(0, 0, 0, 0.3)"
      neu-shadow-raised: "0px 2px 6px rgba(0, 0, 0, 0.5), 0px 1px 4px rgba(0, 0, 0, 0.3)"
      neu-shadow-raised-lg: "0px 4px 10px rgba(0, 0, 0, 0.5), 0px 2px 4px rgba(0, 0, 0, 0.3)"
      neu-shadow-raised-xl: "0px 8px 14px rgba(0, 0, 0, 0.5), 0px 4px 18px rgba(0, 0, 0, 0.3)"
      neu-shadow-float: "0px 6px 12px rgba(0, 0, 0, 0.5), 0px 2px 20px rgba(0, 0, 0, 0.3)"
      neu-shadow-pressed-sm: "none"
      neu-shadow-pressed: "none"
      neu-shadow-pressed-lg: "none"
      neu-shadow-subtle: "0px 1px 3px rgba(0, 0, 0, 0.5), 0px 1px 2px rgba(0, 0, 0, 0.3)"
      
      # Card shadows using Material elevation
      card-box-shadow: "0px 2px 6px rgba(0, 0, 0, 0.5), 0px 1px 4px rgba(0, 0, 0, 0.3)"
      card-box-shadow-hover: "0px 4px 10px rgba(0, 0, 0, 0.5), 0px 2px 4px rgba(0, 0, 0, 0.3)"
      card-box-shadow-active: "none"
      
      # Component shadows
      button-box-shadow: "0px 1px 3px rgba(0, 0, 0, 0.5), 0px 1px 2px rgba(0, 0, 0, 0.3)"
      button-box-shadow-hover: "0px 2px 6px rgba(0, 0, 0, 0.5), 0px 1px 4px rgba(0, 0, 0, 0.3)"
      button-box-shadow-active: "none"
      
      dialog-box-shadow: "0px 8px 14px rgba(0, 0, 0, 0.5), 0px 4px 18px rgba(0, 0, 0, 0.3)"
      sidebar-shadow: "0px 2px 6px rgba(0, 0, 0, 0.5), 0px 1px 4px rgba(0, 0, 0, 0.3)"
      app-header-shadow: "0px 1px 3px rgba(0, 0, 0, 0.5), 0px 1px 2px rgba(0, 0, 0, 0.3)"
      
