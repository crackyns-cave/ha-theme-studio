  # ============================================================================
  # CARD-MOD GLOBAL STYLING - MATERIAL 3
  # ============================================================================
  # Production-ready global card styling using card-mod.
  # Applies Material Design 3 elevation and surface hierarchy.
  # Uses subtle borders and realistic shadows.
  # ============================================================================

  card-mod-theme: Material 3
  
  card-mod-card: |
    ha-card {
      /* Base Material 3 card styling */
      border: var(--m3-border-width) var(--m3-border-style) var(--ha-color-border-neutral-quiet) !important;
      border-radius: var(--m3-radius-card) !important;
      background: var(--card-background-color) !important;
      transition: 
        box-shadow var(--m3-duration-medium-2) var(--m3-easing-standard),
        transform var(--m3-duration-short-4) var(--m3-easing-standard),
        border-color var(--m3-duration-short-2) var(--m3-easing-standard) !important;
      
      /* Prevent glassmorphic effects */
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    
    /* Elevated state - default for most cards (elevation 1) */
    ha-card:not(.heading-card):not(.bubble-card) {
      box-shadow: var(--card-box-shadow) !important;
    }
    
    /* Hover state - elevation increase */
    ha-card:not(.heading-card):not(.bubble-card):hover {
      box-shadow: var(--card-box-shadow-hover) !important;
      transform: translateY(-1px) !important;
      border-color: var(--ha-color-border-neutral-normal) !important;
    }
    
    /* Active/pressed state - elevation decrease */
    ha-card:not(.heading-card):not(.bubble-card):active {
      box-shadow: var(--card-box-shadow-active) !important;
      transform: translateY(0px) !important;
      border-color: var(--ha-color-border-neutral-loud) !important;
    }
    
    /* Heading cards - no elevation, transparent */
    ha-card.heading-card {
      box-shadow: none !important;
      background: transparent !important;
      border: none !important;
    }
    
    /* Card content padding */
    ha-card .card-content {
      padding: var(--card-padding) !important;
    }
    
    /* Card header styling */
    ha-card .card-header {
      font-size: var(--m3-font-size-xl) !important;
      font-weight: var(--m3-font-weight-medium) !important;
      line-height: var(--m3-line-height-normal) !important;
      padding: var(--m3-spacing-md) var(--m3-spacing-md) 0 !important;
    }
  
  card-mod-view: |
    /* Dashboard view styling */
    hui-view {
      background: var(--lovelace-background) !important;
    }
    
    /* Masonry layout gap */
    hui-masonry-view {
      gap: var(--dashboard-gap) !important;
      padding: var(--dashboard-gap) !important;
    }
    
    /* Sections layout gap */
    hui-sections-view {
      gap: var(--section-gap) !important;
      padding: var(--dashboard-gap) !important;
    }
  
  card-mod-root: |
    /* Global app styling */
    app-drawer {
      /* Material 3 sidebar with elevation and border */
      box-shadow: var(--sidebar-shadow) !important;
      background: var(--sidebar-background-color) !important;
      border-right: var(--m3-border-width) var(--m3-border-style) var(--ha-color-border-neutral-quiet) !important;
    }
    
    /* App header */
    app-header {
      background: var(--app-header-background-color) !important;
      box-shadow: var(--app-header-shadow) !important;
      border-bottom: var(--m3-border-width) var(--m3-border-style) var(--ha-color-border-neutral-quiet) !important;
    }
    
    /* Prevent any glassmorphic effects globally */
    * {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
  
  card-mod-more-info: |
    /* More info dialog styling - elevated surface */
    ha-dialog {
      border-radius: var(--m3-radius-dialog) !important;
      box-shadow: var(--dialog-box-shadow) !important;
      background: var(--card-background-color) !important;
      border: var(--m3-border-width) var(--m3-border-style) var(--ha-color-border-neutral-quiet) !important;
    }
    
    /* Dialog backdrop */
    .mdc-dialog__scrim {
      background: var(--ha-color-overlay-scrim) !important;
      backdrop-filter: none !important;
    }
  
  # ----------------------------------------------------------------------------
  # CARD-MOD TILE CARD SPECIFIC
  # ----------------------------------------------------------------------------
  
  card-mod-tile: |
    /* Tile card Material 3 styling */
    .tile {
      border: var(--m3-border-width) var(--m3-border-style) var(--ha-color-border-neutral-quiet) !important;
      border-radius: var(--m3-radius-md) !important;
      box-shadow: var(--m3-elevation-1) !important;
      transition: 
        box-shadow var(--m3-duration-short-4) var(--m3-easing-standard),
        border-color var(--m3-duration-short-2) var(--m3-easing-standard) !important;
    }
    
    .tile:hover {
      box-shadow: var(--m3-elevation-2) !important;
      border-color: var(--ha-color-border-neutral-normal) !important;
    }
    
    .tile:active {
      box-shadow: var(--m3-elevation-0) !important;
      border-color: var(--ha-color-border-neutral-loud) !important;
    }
  
  # ----------------------------------------------------------------------------
  # CARD-MOD BUTTON CARD SPECIFIC
  # ----------------------------------------------------------------------------
  
  card-mod-button: |
    /* Button Material 3 styling */
    .mdc-button,
    ha-button,
    mwc-button {
      border: var(--m3-border-width) var(--m3-border-style) var(--ha-color-border-primary-quiet) !important;
      border-radius: var(--m3-radius-button) !important;
      box-shadow: var(--button-box-shadow) !important;
      transition: 
        box-shadow var(--m3-duration-short-4) var(--m3-easing-standard),
        transform var(--m3-duration-short-4) var(--m3-easing-standard),
        border-color var(--m3-duration-short-2) var(--m3-easing-standard) !important;
    }
    
    .mdc-button:hover,
    ha-button:hover,
    mwc-button:hover {
      box-shadow: var(--button-box-shadow-hover) !important;
      transform: translateY(-1px) !important;
      border-color: var(--ha-color-border-primary-normal) !important;
    }
    
    .mdc-button:active,
    ha-button:active,
    mwc-button:active {
      box-shadow: var(--button-box-shadow-active) !important;
      transform: translateY(0px) !important;
      border-color: var(--ha-color-border-primary-loud) !important;
    }
