  # Mode definitions
  modes:

    # ==========================================================================
    # LIGHT MODE - Frosted Glass
    # ==========================================================================
    # Translucent frosted glass surfaces with backdrop blur and saturation.
    # Apple Big Sur inspired with soft, vibrant aesthetic.
    # ==========================================================================
    
    light:
      
      # ------------------------------------------------------------------------
      # FROSTED GLASS BACKDROP FILTERS
      # ------------------------------------------------------------------------
      
      fg-backdrop-blur-card: "blur(20px) saturate(180%)"
      fg-backdrop-blur-dialog: "blur(30px) saturate(180%)"
      fg-backdrop-blur-sidebar: "blur(20px) saturate(180%)"
      fg-backdrop-blur-header: "blur(20px) saturate(180%)"
      
      # ------------------------------------------------------------------------
      # BASE COLORS - Foundation
      # ------------------------------------------------------------------------
      
      # Primary brand color
      primary-color: "#007AFF"
      accent-color: "#007AFF"
      
      # Semantic state colors
      state-icon-color: "#5E5CE6"
      state-icon-active-color: "#007AFF"
      state-icon-unavailable-color: "#a0a0a0"
      
      # Text colors
      primary-text-color: "#1C1C1E"
      secondary-text-color: "#3C3C43"
      text-primary-color: "#ffffff"
      disabled-text-color: "#8E8E93"
      
      # Background and surface - translucent!
      primary-background-color: "#F2F2F7"
      secondary-background-color: "#E5E5EA"
      lovelace-background: "#F2F2F7"
      
      # Cards - translucent with blur
      card-background-color: "rgba(255, 255, 255, 0.7)"
      card-background-color-hover: "rgba(255, 255, 255, 0.85)"
      card-background-color-active: "rgba(255, 255, 255, 0.6)"
      ha-card-background: "rgba(255, 255, 255, 0.7)"
      
      # Tiles - translucent
      tile-background-color: "rgba(255, 255, 255, 0.6)"
      tile-background-color-hover: "rgba(255, 255, 255, 0.8)"
      tile-background-color-active: "rgba(255, 255, 255, 0.5)"
      
      # Buttons - translucent
      button-background-color: "rgba(255, 255, 255, 0.5)"
      button-background-color-hover: "rgba(255, 255, 255, 0.7)"
      button-background-color-active: "rgba(255, 255, 255, 0.4)"
      
      # Sidebar - translucent
      sidebar-background-color: "rgba(242, 242, 247, 0.8)"
      sidebar-icon-color: "#3C3C43"
      sidebar-selected-icon-color: "#007AFF"
      sidebar-selected-text-color: "#1C1C1E"
      sidebar-text-color: "#3C3C43"
      
      # Dialogs - translucent with heavy blur
      dialog-background-color: "rgba(255, 255, 255, 0.75)"
      
      # App header - translucent
      app-header-background-color: "rgba(242, 242, 247, 0.75)"
      app-header-text-color: "#1C1C1E"
      
      # ------------------------------------------------------------------------
      # FROSTED GLASS BORDERS
      # ------------------------------------------------------------------------
      
      fg-card-border-color: "rgba(0, 0, 0, 0.08)"
      fg-card-border-color-hover: "rgba(0, 122, 255, 0.3)"
      fg-tile-border-color: "rgba(0, 0, 0, 0.06)"
      fg-tile-border-color-hover: "rgba(0, 122, 255, 0.25)"
      fg-button-border-color: "rgba(0, 0, 0, 0.08)"
      fg-button-border-color-hover: "rgba(0, 122, 255, 0.3)"
      fg-sidebar-border-color: "rgba(0, 0, 0, 0.1)"
      fg-header-border-color: "rgba(0, 0, 0, 0.1)"
      fg-dialog-border-color: "rgba(0, 0, 0, 0.1)"
      
      # ------------------------------------------------------------------------
      # FROSTED GLASS SHADOWS - Light Mode
      # ------------------------------------------------------------------------
      
      fg-shadow-subtle: "0px 1px 3px rgba(0, 0, 0, 0.08), 0px 1px 2px rgba(0, 0, 0, 0.06)"
      fg-shadow-sm: "0px 2px 8px rgba(0, 0, 0, 0.08), 0px 1px 4px rgba(0, 0, 0, 0.06)"
      fg-shadow-md: "0px 4px 16px rgba(0, 0, 0, 0.1), 0px 2px 8px rgba(0, 0, 0, 0.06)"
      fg-shadow-lg: "0px 8px 24px rgba(0, 0, 0, 0.12), 0px 4px 12px rgba(0, 0, 0, 0.08)"
      fg-shadow-xl: "0px 16px 48px rgba(0, 0, 0, 0.14), 0px 8px 24px rgba(0, 0, 0, 0.1)"
      
      # Neumorphic compatibility aliases (map to frosted glass shadows)
      neu-shadow-raised-sm: "0px 1px 3px rgba(0, 0, 0, 0.08), 0px 1px 2px rgba(0, 0, 0, 0.06)"
      neu-shadow-raised: "0px 2px 8px rgba(0, 0, 0, 0.08), 0px 1px 4px rgba(0, 0, 0, 0.06)"
      neu-shadow-raised-lg: "0px 4px 16px rgba(0, 0, 0, 0.1), 0px 2px 8px rgba(0, 0, 0, 0.06)"
      neu-shadow-raised-xl: "0px 8px 24px rgba(0, 0, 0, 0.12), 0px 4px 12px rgba(0, 0, 0, 0.08)"
      neu-shadow-float: "0px 4px 12px rgba(0, 0, 0, 0.1), 0px 2px 6px rgba(0, 0, 0, 0.08)"
      neu-shadow-pressed-sm: "0px 1px 2px rgba(0, 0, 0, 0.06)"
      neu-shadow-pressed: "0px 1px 3px rgba(0, 0, 0, 0.08)"
      neu-shadow-pressed-lg: "0px 2px 4px rgba(0, 0, 0, 0.08)"
      neu-shadow-subtle: "0px 1px 3px rgba(0, 0, 0, 0.08), 0px 1px 2px rgba(0, 0, 0, 0.06)"
      
      # Material elevation compatibility
      m3-elevation-0: "none"
      m3-elevation-1: "0px 1px 3px rgba(0, 0, 0, 0.08), 0px 1px 2px rgba(0, 0, 0, 0.06)"
      m3-elevation-2: "0px 2px 8px rgba(0, 0, 0, 0.08), 0px 1px 4px rgba(0, 0, 0, 0.06)"
      m3-elevation-3: "0px 4px 16px rgba(0, 0, 0, 0.1), 0px 2px 8px rgba(0, 0, 0, 0.06)"
      m3-elevation-4: "0px 8px 24px rgba(0, 0, 0, 0.12), 0px 4px 12px rgba(0, 0, 0, 0.08)"
      m3-elevation-5: "0px 16px 48px rgba(0, 0, 0, 0.14), 0px 8px 24px rgba(0, 0, 0, 0.1)"
      
      # Card shadows
      card-box-shadow: "0px 2px 8px rgba(0, 0, 0, 0.08), 0px 1px 4px rgba(0, 0, 0, 0.06)"
      card-box-shadow-hover: "0px 4px 12px rgba(0, 0, 0, 0.1), 0px 2px 6px rgba(0, 0, 0, 0.08)"
      card-box-shadow-active: "0px 1px 3px rgba(0, 0, 0, 0.08), 0px 1px 2px rgba(0, 0, 0, 0.06)"
      
      # Component shadows
      button-box-shadow: "0px 1px 3px rgba(0, 0, 0, 0.08), 0px 1px 2px rgba(0, 0, 0, 0.06)"
      button-box-shadow-hover: "0px 2px 8px rgba(0, 0, 0, 0.08), 0px 1px 4px rgba(0, 0, 0, 0.06)"
      button-box-shadow-active: "0px 1px 2px rgba(0, 0, 0, 0.06)"
      
      dialog-box-shadow: "0px 16px 48px rgba(0, 0, 0, 0.14), 0px 8px 24px rgba(0, 0, 0, 0.1)"
      sidebar-shadow: "0px 2px 8px rgba(0, 0, 0, 0.08), 0px 1px 4px rgba(0, 0, 0, 0.06)"
      app-header-shadow: "0px 1px 3px rgba(0, 0, 0, 0.08), 0px 1px 2px rgba(0, 0, 0, 0.06)"
      
      # ------------------------------------------------------------------------
      # MATERIAL WEB COLORS - Light Mode
      # ------------------------------------------------------------------------
      
      # Primary - iOS blue
      md-sys-color-primary: "#007AFF"
      md-sys-color-on-primary: "#ffffff"
      md-sys-color-primary-container: "#D1E4FF"
      md-sys-color-on-primary-container: "#001D36"
      
