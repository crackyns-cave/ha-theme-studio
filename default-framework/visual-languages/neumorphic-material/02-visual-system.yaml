  # ============================================================================
  # NEUMORPHIC VISUAL SYSTEM
  # ============================================================================
  # Dual-shadow system that creates soft, subtle depth without borders.
  # Shadows are defined per mode (light/dark) with different intensities.
  # ============================================================================

  # ----------------------------------------------------------------------------
  # LIGHT MODE NEUMORPHIC SHADOWS
  # ----------------------------------------------------------------------------
  # Light background with soft depth through positive/negative shadows
  # Positive shadow: rgba(163,177,198,.6) - darker, creates depth
  # Negative shadow: rgba(255,255,255,.8) - lighter, creates highlight
  
  neu-light-shadow-raised-sm: &neu-light-shadow-raised-sm |
    2px 2px 4px rgba(163,177,198,.6),
    -2px -2px 4px rgba(255,255,255,.8)
  
  neu-light-shadow-raised: &neu-light-shadow-raised |
    4px 4px 8px rgba(163,177,198,.6),
    -4px -4px 8px rgba(255,255,255,.8)
  
  neu-light-shadow-raised-lg: &neu-light-shadow-raised-lg |
    8px 8px 16px rgba(163,177,198,.6),
    -8px -8px 16px rgba(255,255,255,.8)
  
  neu-light-shadow-raised-xl: &neu-light-shadow-raised-xl |
    12px 12px 24px rgba(163,177,198,.6),
    -12px -12px 24px rgba(255,255,255,.8)
  
  neu-light-shadow-pressed-sm: &neu-light-shadow-pressed-sm |
    inset 2px 2px 4px rgba(163,177,198,.6),
    inset -2px -2px 4px rgba(255,255,255,.8)
  
  neu-light-shadow-pressed: &neu-light-shadow-pressed |
    inset 4px 4px 8px rgba(163,177,198,.6),
    inset -4px -4px 8px rgba(255,255,255,.8)
  
  neu-light-shadow-pressed-lg: &neu-light-shadow-pressed-lg |
    inset 6px 6px 12px rgba(163,177,198,.6),
    inset -6px -6px 12px rgba(255,255,255,.8)
  
  # Floating/elevated state (cards on hover)
  neu-light-shadow-float: &neu-light-shadow-float |
    6px 6px 12px rgba(163,177,198,.7),
    -6px -6px 12px rgba(255,255,255,.9),
    0px 4px 16px rgba(163,177,198,.3)
  
  # Subtle state (minimal depth)
  neu-light-shadow-subtle: &neu-light-shadow-subtle |
    1px 1px 2px rgba(163,177,198,.4),
    -1px -1px 2px rgba(255,255,255,.6)
  
  # ----------------------------------------------------------------------------
  # DARK MODE NEUMORPHIC SHADOWS
  # ----------------------------------------------------------------------------
  # Dark background with subtle depth through positive/negative shadows
  # Positive shadow: rgba(0,0,0,.35) - darker, creates depth
  # Negative shadow: rgba(255,255,255,.03) - lighter, creates subtle highlight
  
  neu-dark-shadow-raised-sm: &neu-dark-shadow-raised-sm |
    2px 2px 4px rgba(0,0,0,.35),
    -2px -2px 4px rgba(255,255,255,.03)
  
  neu-dark-shadow-raised: &neu-dark-shadow-raised |
    4px 4px 8px rgba(0,0,0,.35),
    -4px -4px 8px rgba(255,255,255,.03)
  
  neu-dark-shadow-raised-lg: &neu-dark-shadow-raised-lg |
    8px 8px 16px rgba(0,0,0,.35),
    -8px -8px 16px rgba(255,255,255,.03)
  
  neu-dark-shadow-raised-xl: &neu-dark-shadow-raised-xl |
    12px 12px 24px rgba(0,0,0,.35),
    -12px -12px 24px rgba(255,255,255,.03)
  
  neu-dark-shadow-pressed-sm: &neu-dark-shadow-pressed-sm |
    inset 2px 2px 4px rgba(0,0,0,.35),
    inset -2px -2px 4px rgba(255,255,255,.03)
  
  neu-dark-shadow-pressed: &neu-dark-shadow-pressed |
    inset 4px 4px 8px rgba(0,0,0,.35),
    inset -4px -4px 8px rgba(255,255,255,.03)
  
  neu-dark-shadow-pressed-lg: &neu-dark-shadow-pressed-lg |
    inset 6px 6px 12px rgba(0,0,0,.35),
    inset -6px -6px 12px rgba(255,255,255,.03)
  
  # Floating/elevated state (cards on hover)
  neu-dark-shadow-float: &neu-dark-shadow-float |
    6px 6px 12px rgba(0,0,0,.45),
    -6px -6px 12px rgba(255,255,255,.05),
    0px 4px 16px rgba(0,0,0,.25)
  
  # Subtle state (minimal depth)
  neu-dark-shadow-subtle: &neu-dark-shadow-subtle |
    1px 1px 2px rgba(0,0,0,.25),
    -1px -1px 2px rgba(255,255,255,.02)
  
  # ----------------------------------------------------------------------------
  # CROSS-COMPATIBILITY ALIASES
  # ----------------------------------------------------------------------------
  # Aliases for glass-* variables used by some color palettes
  # Neumorphic uses same base colors as background, not glass effects
  
  # Glass background aliases (solid neumorphic surfaces)
  glass-bg-light-resting: &glass-bg-light-resting "#ECEFF4"
  glass-bg-light-hover: &glass-bg-light-hover "#E5E8EF"
  glass-bg-light-active: &glass-bg-light-active "#F0F2F7"
  glass-bg-light-subtle: &glass-bg-light-subtle "#F5F6F9"
  glass-bg-light-intense: &glass-bg-light-intense "#E0E3EA"
  
  glass-bg-dark-resting: &glass-bg-dark-resting "#2E3440"
  glass-bg-dark-hover: &glass-bg-dark-hover "#3B4252"
  glass-bg-dark-active: &glass-bg-dark-active "#323844"
  glass-bg-dark-subtle: &glass-bg-dark-subtle "#242933"
  glass-bg-dark-intense: &glass-bg-dark-intense "#434C5E"
  
  # Glass blur aliases (Neumorphic doesn't use blur)
  glass-blur-subtle: &glass-blur-subtle "none"
  glass-blur-light: &glass-blur-light "none"
  glass-blur-medium: &glass-blur-medium "none"
  glass-blur-heavy: &glass-blur-heavy "none"
  glass-blur-intense: &glass-blur-intense "none"
  glass-blur-card: &glass-blur-card "none"
  glass-blur-dialog: &glass-blur-dialog "none"
  glass-blur-sidebar: &glass-blur-sidebar "none"
  glass-blur-header: &glass-blur-header "none"
  
  # Glass border aliases (Neumorphic uses no borders, providing minimal)
  glass-border-light-quiet: &glass-border-light-quiet "rgba(163, 177, 198, 0.15)"
  glass-border-light-normal: &glass-border-light-normal "rgba(163, 177, 198, 0.20)"
  glass-border-light-loud: &glass-border-light-loud "rgba(163, 177, 198, 0.30)"
  glass-border-light-luminous: &glass-border-light-luminous "rgba(163, 177, 198, 0.40)"
  glass-border-light-accent: &glass-border-light-accent "rgba(98, 114, 164, 0.35)"
  
  glass-border-dark-quiet: &glass-border-dark-quiet "rgba(255, 255, 255, 0.05)"
  glass-border-dark-normal: &glass-border-dark-normal "rgba(255, 255, 255, 0.08)"
  glass-border-dark-loud: &glass-border-dark-loud "rgba(255, 255, 255, 0.12)"
  glass-border-dark-luminous: &glass-border-dark-luminous "rgba(255, 255, 255, 0.18)"
  glass-border-dark-accent: &glass-border-dark-accent "rgba(136, 192, 208, 0.30)"
  
  glass-border-width-thin: &glass-border-width-thin "0.5px"
  glass-border-width-normal: &glass-border-width-normal "1px"
  glass-border-width-thick: &glass-border-width-thick "1.5px"
  
  # Glass shadow aliases (using neumorphic shadows)
  glass-shadow-light-subtle: *neu-light-shadow-subtle
  glass-shadow-light-sm: *neu-light-shadow-raised-sm
  glass-shadow-light-md: *neu-light-shadow-raised
  glass-shadow-light-lg: *neu-light-shadow-raised-lg
  glass-shadow-light-xl: *neu-light-shadow-raised-xl
  
  glass-shadow-dark-subtle: *neu-dark-shadow-subtle
  glass-shadow-dark-sm: *neu-dark-shadow-raised-sm
  glass-shadow-dark-md: *neu-dark-shadow-raised
  glass-shadow-dark-lg: *neu-dark-shadow-raised-lg
  glass-shadow-dark-xl: *neu-dark-shadow-raised-xl
  
  # Glass highlight aliases (Neumorphic uses shadows, not highlights)
  glass-highlight-light-edge: &glass-highlight-light-edge "rgba(255, 255, 255, 0.80)"
  glass-highlight-light-glow: &glass-highlight-light-glow "rgba(255, 255, 255, 0.60)"
  glass-highlight-light-shine: &glass-highlight-light-shine "none"
  
  glass-highlight-dark-edge: &glass-highlight-dark-edge "rgba(255, 255, 255, 0.03)"
  glass-highlight-dark-glow: &glass-highlight-dark-glow "rgba(255, 255, 255, 0.02)"
  glass-highlight-dark-shine: &glass-highlight-dark-shine "none"
  
  # Glass radius aliases
  glass-radius-sm: &glass-radius-sm "8px"
  glass-radius: &glass-radius "12px"
  glass-radius-lg: &glass-radius-lg "16px"
  glass-radius-xl: &glass-radius-xl "24px"
  glass-radius-pill: &glass-radius-pill "999px"
