      md-sys-color-surface-container-lowest: "#ffffff"
      md-sys-color-surface-container-low: "#FAFAFA"
      md-sys-color-surface-container: "#F2F2F7"
      md-sys-color-surface-container-high: "#E5E5EA"
      md-sys-color-surface-container-highest: "#D1D1D6"
      
      # Background
      md-sys-color-background: "#F2F2F7"
      md-sys-color-on-background: "#1C1C1E"
      
      # Outline
      md-sys-color-outline: "#8E8E93"
      md-sys-color-outline-variant: "#C6C6C8"
      
      # Inverse
      md-sys-color-inverse-surface: "#2C2C2E"
      md-sys-color-inverse-on-surface: "#F2F2F7"
      md-sys-color-inverse-primary: "#5AC8FA"
      
      # Scrim & shadow
      md-sys-color-scrim: "#000000"
      md-sys-color-shadow: "#000000"
      md-sys-color-surface-tint: "#007AFF"
      
