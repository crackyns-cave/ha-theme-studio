  # ============================================================================
  # CARD-MOD GLOBAL STYLING - FROSTED GLASS
  # ============================================================================
  # Production-ready global card styling using card-mod.
  # Applies frosted glass aesthetic with backdrop blur and translucency.
  # Uses soft borders and subtle shadows.
  # ============================================================================

  card-mod-theme: Frosted Glass
  
  card-mod-card: |
    ha-card {
      /* Frosted glass card styling */
      border: var(--fg-border-width) var(--fg-border-style) var(--fg-card-border-color) !important;
      border-radius: var(--m3-radius-card) !important;
      background: var(--card-background-color) !important;
      backdrop-filter: var(--fg-backdrop-blur-card) !important;
      -webkit-backdrop-filter: var(--fg-backdrop-blur-card) !important;
      transition: 
        box-shadow var(--m3-duration-medium-2) var(--m3-easing-standard),
        transform var(--m3-duration-short-4) var(--m3-easing-standard),
        border-color var(--m3-duration-short-2) var(--m3-easing-standard),
        background var(--m3-duration-short-2) var(--m3-easing-standard) !important;
    }
    
    /* Default card state - subtle shadow */
    ha-card:not(.heading-card):not(.bubble-card) {
      box-shadow: var(--card-box-shadow) !important;
    }
    
    /* Hover state - elevated with enhanced translucency */
    ha-card:not(.heading-card):not(.bubble-card):hover {
      box-shadow: var(--card-box-shadow-hover) !important;
      transform: translateY(-2px) !important;
      background: var(--card-background-color-hover) !important;
      border-color: var(--fg-card-border-color-hover) !important;
    }
    
    /* Active/pressed state */
    ha-card:not(.heading-card):not(.bubble-card):active {
      box-shadow: var(--card-box-shadow-active) !important;
      transform: translateY(0px) !important;
      background: var(--card-background-color-active) !important;
    }
    
    /* Heading cards - fully transparent */
    ha-card.heading-card {
      box-shadow: none !important;
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
    }
    
    /* Card content padding */
    ha-card .card-content {
      padding: var(--card-padding) !important;
    }
    
    /* Card header styling */
    ha-card .card-header {
      font-size: var(--m3-font-size-xl) !important;
      font-weight: var(--m3-font-weight-medium) !important;
      line-height: var(--m3-line-height-normal) !important;
      padding: var(--m3-spacing-md) var(--m3-spacing-md) 0 !important;
    }
  
  card-mod-view: |
    /* Dashboard view styling */
    hui-view {
      background: var(--lovelace-background) !important;
    }
    
    /* Masonry layout gap */
    hui-masonry-view {
      gap: var(--dashboard-gap) !important;
      padding: var(--dashboard-gap) !important;
    }
    
    /* Sections layout gap */
    hui-sections-view {
      gap: var(--section-gap) !important;
      padding: var(--dashboard-gap) !important;
    }
  
  card-mod-root: |
    /* Global app styling */
    app-drawer {
      /* Frosted glass sidebar */
      box-shadow: var(--sidebar-shadow) !important;
      background: var(--sidebar-background-color) !important;
      backdrop-filter: var(--fg-backdrop-blur-sidebar) !important;
      -webkit-backdrop-filter: var(--fg-backdrop-blur-sidebar) !important;
      border-right: var(--fg-border-width) var(--fg-border-style) var(--fg-sidebar-border-color) !important;
    }
    
    /* App header with frosted glass */
    app-header {
      background: var(--app-header-background-color) !important;
      box-shadow: var(--app-header-shadow) !important;
      backdrop-filter: var(--fg-backdrop-blur-header) !important;
      -webkit-backdrop-filter: var(--fg-backdrop-blur-header) !important;
      border-bottom: var(--fg-border-width) var(--fg-border-style) var(--fg-header-border-color) !important;
    }
  
  card-mod-more-info: |
    /* More info dialog with heavy frosted glass effect */
    ha-dialog {
      border-radius: var(--m3-radius-dialog) !important;
      box-shadow: var(--dialog-box-shadow) !important;
      background: var(--dialog-background-color) !important;
      backdrop-filter: var(--fg-backdrop-blur-dialog) !important;
      -webkit-backdrop-filter: var(--fg-backdrop-blur-dialog) !important;
      border: var(--fg-border-width) var(--fg-border-style) var(--fg-dialog-border-color) !important;
    }
    
    /* Dialog backdrop with blur */
    .mdc-dialog__scrim {
      background: var(--ha-color-overlay-scrim) !important;
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
    }
  
  # ----------------------------------------------------------------------------
  # CARD-MOD TILE CARD SPECIFIC
  # ----------------------------------------------------------------------------
  
  card-mod-tile: |
    /* Tile card frosted glass styling */
    .tile {
      border: var(--fg-border-width) var(--fg-border-style) var(--fg-tile-border-color) !important;
      border-radius: var(--m3-radius-md) !important;
      background: var(--tile-background-color) !important;
      backdrop-filter: var(--fg-backdrop-blur-card) !important;
      -webkit-backdrop-filter: var(--fg-backdrop-blur-card) !important;
      box-shadow: var(--fg-shadow-subtle) !important;
      transition: 
        box-shadow var(--m3-duration-short-4) var(--m3-easing-standard),
        border-color var(--m3-duration-short-2) var(--m3-easing-standard),
        background var(--m3-duration-short-2) var(--m3-easing-standard) !important;
    }
    
    .tile:hover {
      box-shadow: var(--fg-shadow-sm) !important;
      border-color: var(--fg-tile-border-color-hover) !important;
      background: var(--tile-background-color-hover) !important;
    }
    
    .tile:active {
      box-shadow: var(--fg-shadow-subtle) !important;
      background: var(--tile-background-color-active) !important;
    }
  
  # ----------------------------------------------------------------------------
  # CARD-MOD BUTTON CARD SPECIFIC
  # ----------------------------------------------------------------------------
  
  card-mod-button: |
    /* Button frosted glass styling */
    .mdc-button,
    ha-button,
    mwc-button {
      color: var(--text-primary-color) !important;
      border: var(--fg-border-width) var(--fg-border-style) var(--fg-button-border-color) !important;
      border-radius: var(--m3-radius-button) !important;
      background: var(--button-background-color) !important;
      backdrop-filter: blur(10px) saturate(150%) !important;
      -webkit-backdrop-filter: blur(10px) saturate(150%) !important;
      box-shadow: var(--button-box-shadow) !important;
      transition: 
        box-shadow var(--m3-duration-short-4) var(--m3-easing-standard),
        transform var(--m3-duration-short-4) var(--m3-easing-standard),
        border-color var(--m3-duration-short-2) var(--m3-easing-standard),
        background var(--m3-duration-short-2) var(--m3-easing-standard) !important;
    }
    
    .mdc-button:hover,
    ha-button:hover,
    mwc-button:hover {
      box-shadow: var(--button-box-shadow-hover) !important;
      transform: translateY(-1px) !important;
      border-color: var(--fg-button-border-color-hover) !important;
      background: var(--button-background-color-hover) !important;
    }
    
    .mdc-button:active,
    ha-button:active,
    mwc-button:active {
      box-shadow: var(--button-box-shadow-active) !important;
      transform: translateY(0px) !important;
      background: var(--button-background-color-active) !important;
    }
