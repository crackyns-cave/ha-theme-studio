    # ==========================================================================
    # DARK MODE - Frosted Glass
    # ==========================================================================
    # Translucent frosted glass surfaces with backdrop blur and saturation.
    # Apple Big Sur dark mode inspired with rich, deep aesthetic.
    # ==========================================================================
    
    dark:
      
      # ------------------------------------------------------------------------
      # FROSTED GLASS BACKDROP FILTERS
      # ------------------------------------------------------------------------
      
      fg-backdrop-blur-card: "blur(30px) saturate(180%)"
      fg-backdrop-blur-dialog: "blur(40px) saturate(200%)"
      fg-backdrop-blur-sidebar: "blur(30px) saturate(180%)"
      fg-backdrop-blur-header: "blur(30px) saturate(180%)"
      
      # ------------------------------------------------------------------------
      # BASE COLORS - Foundation
      # ------------------------------------------------------------------------
      
      # Primary brand color
      primary-color: "#0A84FF"
      accent-color: "#0A84FF"
      
      # Semantic state colors
      state-icon-color: "#BF5AF2"
      state-icon-active-color: "#0A84FF"
      state-icon-unavailable-color: "#636366"
      
      # Text colors
      primary-text-color: "#F2F2F7"
      secondary-text-color: "#AEAEB2"
      text-primary-color: "#000000"
      disabled-text-color: "#636366"
      
      # Background and surface - translucent!
      primary-background-color: "#000000"
      secondary-background-color: "#1C1C1E"
      lovelace-background: "#000000"
      
      # Cards - translucent with blur
      card-background-color: "rgba(28, 28, 30, 0.7)"
      card-background-color-hover: "rgba(44, 44, 46, 0.85)"
      card-background-color-active: "rgba(28, 28, 30, 0.6)"
      ha-card-background: "rgba(28, 28, 30, 0.7)"
      
      # Tiles - translucent
      tile-background-color: "rgba(28, 28, 30, 0.6)"
      tile-background-color-hover: "rgba(44, 44, 46, 0.8)"
      tile-background-color-active: "rgba(28, 28, 30, 0.5)"
      
      # Buttons - translucent
      button-background-color: "rgba(44, 44, 46, 0.6)"
      button-background-color-hover: "rgba(58, 58, 60, 0.75)"
      button-background-color-active: "rgba(28, 28, 30, 0.5)"
      
      # Sidebar - translucent
      sidebar-background-color: "rgba(0, 0, 0, 0.85)"
      sidebar-icon-color: "#AEAEB2"
      sidebar-selected-icon-color: "#0A84FF"
      sidebar-selected-text-color: "#F2F2F7"
      sidebar-text-color: "#AEAEB2"
      
      # Dialogs - translucent with heavy blur
      dialog-background-color: "rgba(44, 44, 46, 0.8)"
      
      # App header - translucent
      app-header-background-color: "rgba(0, 0, 0, 0.8)"
      app-header-text-color: "#F2F2F7"
      
      # ------------------------------------------------------------------------
      # FROSTED GLASS BORDERS
      # ------------------------------------------------------------------------
      
      fg-card-border-color: "rgba(255, 255, 255, 0.08)"
      fg-card-border-color-hover: "rgba(10, 132, 255, 0.4)"
      fg-tile-border-color: "rgba(255, 255, 255, 0.06)"
      fg-tile-border-color-hover: "rgba(10, 132, 255, 0.3)"
      fg-button-border-color: "rgba(255, 255, 255, 0.08)"
      fg-button-border-color-hover: "rgba(10, 132, 255, 0.4)"
      fg-sidebar-border-color: "rgba(255, 255, 255, 0.1)"
      fg-header-border-color: "rgba(255, 255, 255, 0.1)"
      fg-dialog-border-color: "rgba(255, 255, 255, 0.12)"
      
      # ------------------------------------------------------------------------
      # FROSTED GLASS SHADOWS - Dark Mode
      # ------------------------------------------------------------------------
      
      fg-shadow-subtle: "0px 1px 3px rgba(0, 0, 0, 0.3), 0px 1px 2px rgba(0, 0, 0, 0.2)"
      fg-shadow-sm: "0px 2px 8px rgba(0, 0, 0, 0.4), 0px 1px 4px rgba(0, 0, 0, 0.3)"
      fg-shadow-md: "0px 4px 16px rgba(0, 0, 0, 0.5), 0px 2px 8px rgba(0, 0, 0, 0.3)"
      fg-shadow-lg: "0px 8px 24px rgba(0, 0, 0, 0.6), 0px 4px 12px rgba(0, 0, 0, 0.4)"
      fg-shadow-xl: "0px 16px 48px rgba(0, 0, 0, 0.7), 0px 8px 24px rgba(0, 0, 0, 0.5)"
      
      # Neumorphic compatibility aliases (map to frosted glass shadows)
      neu-shadow-raised-sm: "0px 1px 3px rgba(0, 0, 0, 0.3), 0px 1px 2px rgba(0, 0, 0, 0.2)"
      neu-shadow-raised: "0px 2px 8px rgba(0, 0, 0, 0.4), 0px 1px 4px rgba(0, 0, 0, 0.3)"
      neu-shadow-raised-lg: "0px 4px 16px rgba(0, 0, 0, 0.5), 0px 2px 8px rgba(0, 0, 0, 0.3)"
      neu-shadow-raised-xl: "0px 8px 24px rgba(0, 0, 0, 0.6), 0px 4px 12px rgba(0, 0, 0, 0.4)"
      neu-shadow-float: "0px 6px 20px rgba(0, 0, 0, 0.6), 0px 3px 10px rgba(0, 0, 0, 0.4)"
      neu-shadow-pressed-sm: "0px 1px 2px rgba(0, 0, 0, 0.2)"
      neu-shadow-pressed: "0px 1px 3px rgba(0, 0, 0, 0.3)"
      neu-shadow-pressed-lg: "0px 2px 4px rgba(0, 0, 0, 0.3)"
      neu-shadow-subtle: "0px 1px 3px rgba(0, 0, 0, 0.3), 0px 1px 2px rgba(0, 0, 0, 0.2)"
      
      # Material elevation compatibility
      m3-elevation-0: "none"
      m3-elevation-1: "0px 1px 3px rgba(0, 0, 0, 0.3), 0px 1px 2px rgba(0, 0, 0, 0.2)"
      m3-elevation-2: "0px 2px 8px rgba(0, 0, 0, 0.4), 0px 1px 4px rgba(0, 0, 0, 0.3)"
      m3-elevation-3: "0px 4px 16px rgba(0, 0, 0, 0.5), 0px 2px 8px rgba(0, 0, 0, 0.3)"
      m3-elevation-4: "0px 8px 24px rgba(0, 0, 0, 0.6), 0px 4px 12px rgba(0, 0, 0, 0.4)"
      m3-elevation-5: "0px 16px 48px rgba(0, 0, 0, 0.7), 0px 8px 24px rgba(0, 0, 0, 0.5)"
      
      # Card shadows
      card-box-shadow: "0px 2px 8px rgba(0, 0, 0, 0.4), 0px 1px 4px rgba(0, 0, 0, 0.3)"
      card-box-shadow-hover: "0px 4px 12px rgba(0, 0, 0, 0.5), 0px 2px 6px rgba(0, 0, 0, 0.4)"
      card-box-shadow-active: "0px 1px 3px rgba(0, 0, 0, 0.3), 0px 1px 2px rgba(0, 0, 0, 0.2)"
      
      # Component shadows
      button-box-shadow: "0px 1px 3px rgba(0, 0, 0, 0.3), 0px 1px 2px rgba(0, 0, 0, 0.2)"
      button-box-shadow-hover: "0px 2px 8px rgba(0, 0, 0, 0.4), 0px 1px 4px rgba(0, 0, 0, 0.3)"
