  # These tokens are used by Material Web Components (MWC) and follow
  # the official Material Design 3 color system specification.
  # Shared across all theme variants.
  # ============================================================================

  # ----------------------------------------------------------------------------
  # MATERIAL 3 COLOR ROLE ANCHORS (Mode-Agnostic Definitions)
  # ----------------------------------------------------------------------------
