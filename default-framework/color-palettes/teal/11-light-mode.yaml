    # ==========================================================================
    # LIGHT MODE - Material Teal
    # ==========================================================================
    # Vibrant red color scheme based on Material Design
    # Primary: #009688 | Background: #FAFAFA
    # ==========================================================================
    
    light:
      
      # ------------------------------------------------------------------------
      # BASE COLORS - Foundation
      # ------------------------------------------------------------------------
      
      # Primary brand color
      primary-color: "#009688"
      accent-color: "#009688"
      
      # Semantic state colors
      state-icon-color: "#44739e"
      state-icon-active-color: "#009688"
      state-icon-unavailable-color: "#a0a0a0"
      
      # Text colors
      primary-text-color: "#1C1B1F"
      secondary-text-color: "#49454F"
      text-primary-color: "#ffffff"
      disabled-text-color: "#938F99"
      
      # Background and surface
      primary-background-color: "#FAFAFA"
      secondary-background-color: "#F5F5F5"
      lovelace-background: "#FAFAFA"
      
      # Cards - using surface-container
      card-background-color: "#F5F5F5"
      ha-card-background: "#F5F5F5"
      
      # Sidebar - using surface-container-low
      sidebar-background-color: "#FFFFFF"
      sidebar-icon-color: "#49454F"
      sidebar-selected-icon-color: "#009688"
      sidebar-selected-text-color: "#1C1B1F"
      sidebar-text-color: "#49454F"
      
      # ------------------------------------------------------------------------
      # MATERIAL 3 ELEVATION SHADOWS - Light Mode
      # ------------------------------------------------------------------------
      
      m3-elevation-0: "none"
      m3-elevation-1: "0px 1px 2px rgba(0, 0, 0, 0.3), 0px 1px 3px rgba(0, 0, 0, 0.15)"
      m3-elevation-2: "0px 1px 5px rgba(0, 0, 0, 0.3), 0px 3px 4px rgba(0, 0, 0, 0.15)"
      m3-elevation-3: "0px 4px 8px rgba(0, 0, 0, 0.3), 0px 1px 3px rgba(0, 0, 0, 0.15)"
      m3-elevation-4: "0px 6px 10px rgba(0, 0, 0, 0.3), 0px 1px 18px rgba(0, 0, 0, 0.15)"
      m3-elevation-5: "0px 8px 12px rgba(0, 0, 0, 0.3), 0px 4px 16px rgba(0, 0, 0, 0.15)"
      
      # Neumorphic compatibility aliases (map to Material elevation)
      neu-shadow-raised-sm: "0px 1px 2px rgba(0, 0, 0, 0.3), 0px 1px 3px rgba(0, 0, 0, 0.15)"
      neu-shadow-raised: "0px 1px 5px rgba(0, 0, 0, 0.3), 0px 3px 4px rgba(0, 0, 0, 0.15)"
      neu-shadow-raised-lg: "0px 4px 8px rgba(0, 0, 0, 0.3), 0px 1px 3px rgba(0, 0, 0, 0.15)"
      neu-shadow-raised-xl: "0px 8px 12px rgba(0, 0, 0, 0.3), 0px 4px 16px rgba(0, 0, 0, 0.15)"
      neu-shadow-float: "0px 6px 10px rgba(0, 0, 0, 0.3), 0px 1px 18px rgba(0, 0, 0, 0.15)"
      neu-shadow-pressed-sm: "none"
      neu-shadow-pressed: "none"
      neu-shadow-pressed-lg: "none"
      neu-shadow-subtle: "0px 1px 2px rgba(0, 0, 0, 0.3), 0px 1px 3px rgba(0, 0, 0, 0.15)"
      
      # Card shadows using Material elevation
      card-box-shadow: "0px 1px 5px rgba(0, 0, 0, 0.3), 0px 3px 4px rgba(0, 0, 0, 0.15)"
      card-box-shadow-hover: "0px 4px 8px rgba(0, 0, 0, 0.3), 0px 1px 3px rgba(0, 0, 0, 0.15)"
      card-box-shadow-active: "none"
      
      # Component shadows
      button-box-shadow: "0px 1px 2px rgba(0, 0, 0, 0.3), 0px 1px 3px rgba(0, 0, 0, 0.15)"
      button-box-shadow-hover: "0px 1px 5px rgba(0, 0, 0, 0.3), 0px 3px 4px rgba(0, 0, 0, 0.15)"
      button-box-shadow-active: "none"
      
      dialog-box-shadow: "0px 8px 12px rgba(0, 0, 0, 0.3), 0px 4px 16px rgba(0, 0, 0, 0.15)"
      sidebar-shadow: "0px 1px 5px rgba(0, 0, 0, 0.3), 0px 3px 4px rgba(0, 0, 0, 0.15)"
      app-header-shadow: "0px 1px 2px rgba(0, 0, 0, 0.3), 0px 1px 3px rgba(0, 0, 0, 0.15)"
      
      # ------------------------------------------------------------------------
      # MATERIAL WEB COLORS - Light Mode
      # ------------------------------------------------------------------------
      
      # Primary
      md-sys-color-primary: "#009688"
      md-sys-color-on-primary: "#ffffff"
      md-sys-color-primary-container: "#E0F2F1"
      md-sys-color-on-primary-container: "#004D40"
      
      # Secondary
