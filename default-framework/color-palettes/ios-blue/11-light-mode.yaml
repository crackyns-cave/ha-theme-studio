      md-sys-color-on-tertiary: "#ffffff"
      md-sys-color-tertiary-container: "#FFD9E2"
      md-sys-color-on-tertiary-container: "#3E0016"
      
      # Error
      md-sys-color-error: "#FF3B30"
      md-sys-color-on-error: "#ffffff"
      md-sys-color-error-container: "#FFDAD6"
      md-sys-color-on-error-container: "#410002"
      
      # Surface
      md-sys-color-surface: "#F2F2F7"
      md-sys-color-on-surface: "#1C1C1E"
      md-sys-color-on-surface-variant: "#3C3C43"
      md-sys-color-surface-dim: "#E5E5EA"
